<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Event Kalender</title>
    <!-- Tailwind CSS CDN für schnelles Responsive Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron (Gaming style) & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* Custom Customizations & Neon Effects */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d17;
            color: #e2e8f0;
            margin: 0;
            padding: 10px;
        }

        .font-gaming {
            font-family: 'Orbitron', sans-serif;
        }

        /* Neon Glow Effects */
        .glow-purple {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .glow-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
        .glow-pink {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }

        .text-glow-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.6);
        }
        .text-glow-purple {
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }

        /* Cyberpunk Card Border Effect */
        .cyber-border {
            border: 1px solid rgba(168, 85, 247, 0.25);
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.95) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(8px);
        }

        .cyber-border:hover {
            border-color: rgba(6, 182, 212, 0.5);
        }

        /* Day tile hover & active state */
        .day-tile {
            transition: all 0.2s ease-in-out;
            min-height: 70px;
        }

        .day-tile:hover {
            transform: translateY(-2px);
            background-color: rgba(30, 41, 59, 0.8);
        }

        /* Custom Scrollbar for Event List */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a855f7;
        }
    </style>
</head>
<body>

    <div class="max-w-5xl mx-auto my-4 p-4 md:p-6 rounded-2xl cyber-border shadow-2xl relative overflow-hidden">
        
        <!-- Background Decorative Elements -->
        <div class="absolute -top-24 -right-24 w-60 h-60 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-60 h-60 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- HEADER SECTION -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-cyan-500 flex items-center justify-center glow-purple">
                    <i class="fa-solid fa-gamepad text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold font-gaming tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-cyan-400 to-pink-500">
                        STREAM & EVENT SCHEDULE
                    </h1>
                    <p class="text-xs text-slate-400">Verpasse keinen Stream, Turnier oder Community-Event!</p>
                </div>
            </div>

            <!-- Controls & Admin Toggle -->
            <div class="flex items-center gap-2 flex-wrap justify-end">
                <button id="todayBtn" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                    Heute
                </button>
                <button id="openAdminBtn" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-purple-900/40 hover:bg-purple-800/60 text-purple-300 border border-purple-500/40 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-xs"></i> Event Manager
                </button>
            </div>
        </div>

        <!-- FILTER & NAVIGATION BAR -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
            
            <!-- Month Navigation -->
            <div class="flex items-center gap-3 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800 w-full sm:w-auto justify-between">
                <button id="prevMonthBtn" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-purple-600/30 hover:text-purple-300 text-slate-300 flex items-center justify-center transition">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span id="currentMonthYear" class="font-gaming font-bold text-lg px-4 text-cyan-400 text-glow-cyan min-w-[160px] text-center">
                    Januar 2026
                </span>
                <button id="nextMonthBtn" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-purple-600/30 hover:text-purple-300 text-slate-300 flex items-center justify-center transition">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Category Filters -->
            <div class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0 text-xs">
                <button class="filter-btn active px-3 py-1.5 rounded-lg font-medium transition bg-purple-600 text-white" data-category="all">
                    Alle
                </button>
                <button class="filter-btn px-3 py-1.5 rounded-lg font-medium transition bg-slate-800/80 hover:bg-slate-700 text-slate-300" data-category="Stream">
                    <span class="w-2 h-2 rounded-full bg-purple-400 inline-block mr-1"></span> Stream
                </button>
                <button class="filter-btn px-3 py-1.5 rounded-lg font-medium transition bg-slate-800/80 hover:bg-slate-700 text-slate-300" data-category="Tournament">
                    <span class="w-2 h-2 rounded-full bg-red-400 inline-block mr-1"></span> Turnier
                </button>
                <button class="filter-btn px-3 py-1.5 rounded-lg font-medium transition bg-slate-800/80 hover:bg-slate-700 text-slate-300" data-category="Community">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block mr-1"></span> Community
                </button>
                <button class="filter-btn px-3 py-1.5 rounded-lg font-medium transition bg-slate-800/80 hover:bg-slate-700 text-slate-300" data-category="Special">
                    <span class="w-2 h-2 rounded-full bg-amber-400 inline-block mr-1"></span> Special
                </button>
            </div>
        </div>

        <!-- MAIN CALENDAR GRID & UPCOMING EVENTS SIDEBAR -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- CALENDAR GRID (2 Columns wide on LG) -->
            <div class="lg:col-span-2">
                <!-- Days Header -->
                <div class="grid grid-cols-7 gap-1 text-center font-gaming text-xs text-slate-400 font-semibold mb-2">
                    <div>MO</div><div>DI</div><div>MI</div><div>DO</div><div>FR</div><div>SA</div><div>SO</div>
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1.5">
                    <!-- Javascript populates days here -->
                </div>
            </div>

            <!-- UPCOMING EVENTS LIST SIDEBAR -->
            <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-800/80 flex flex-col h-full">
                <h3 class="font-gaming font-bold text-sm text-purple-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-400"></i> NÄCHSTE EVENTS
                </h3>
                
                <div id="upcomingEventsList" class="space-y-2.5 overflow-y-auto max-h-[380px] pr-1 flex-grow">
                    <!-- JS injects upcoming events here -->
                </div>
            </div>

        </div>

    </div>

    <!-- EVENT DETAILS MODAL -->
    <div id="eventModal" class="fixed inset
